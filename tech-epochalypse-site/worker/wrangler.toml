name = "te-gallery-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[[r2_buckets]]
binding = "GALLERY_BUCKET"
bucket_name = "te-gallery"

# KV — used by the per-submission ♥ voting flow (community-pick).
[[kv_namespaces]]
binding = "VOTES_KV"
id = "fcc59bfffd714fefa4373b4c0d26329b"
preview_id = "f1c70412fc2b42e9a0321c2640c4a974"

# D1 database for the /vs voting tool (Elo-based pairwise voting).
# Create it once with:
#   npx wrangler d1 create te-vs
# then paste the returned database_id below and run:
#   npx wrangler d1 execute te-vs --file=./schema.sql --remote
[[d1_databases]]
binding = "VS_DB"
database_name = "te-vs"
database_id = "3937102a-b1a5-47d8-b32b-10c22ae56c85"

# Admin token for /vs/admin/* endpoints (approve/reject submissions).
# Set via: npx wrangler secret put VS_ADMIN_TOKEN

# Airtable integration — set these secrets via:
#   npx wrangler secret put AIRTABLE_PAT
#   npx wrangler secret put AIRTABLE_BASE_ID
#   npx wrangler secret put AIRTABLE_TABLE_NAME
# Optional secrets for contact form:
#   npx wrangler secret put TURNSTILE_SECRET
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put CONTACT_EMAIL
