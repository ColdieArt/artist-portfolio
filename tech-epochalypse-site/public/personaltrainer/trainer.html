<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="theme-color" content="#0d0f14">
<title>Lift Log</title>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161a22;
    --surface-2: #1e242f;
    --border: #2a313d;
    --text: #eef1f6;
    --muted: #8a93a3;
    --accent: #4f8cff;
    --accent-dim: #2b3a57;
    --good: #34d399;
    --gold: #f5b942;
    --danger: #ff5a5a;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: contain;
  }
  body {
    padding-bottom: env(safe-area-inset-bottom);
    min-height: 100vh;
  }
  .app { max-width: 640px; margin: 0 auto; }

  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(13,15,20,0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: calc(env(safe-area-inset-top) + 14px) 16px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 19px; margin: 0; flex: 1; font-weight: 700; letter-spacing: .3px; }
  .back-btn {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 9px 14px;
    font-size: 16px;
    cursor: pointer;
    font-weight: 600;
  }
  .nav-tab {
    background: none; border: none; color: var(--muted);
    font-size: 15px; font-weight: 600; cursor: pointer; padding: 8px 4px;
  }
  .nav-tab.active { color: var(--accent); }

  main { padding: 16px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 14px;
  }

  .day-card {
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer;
    transition: transform .08s ease, background .15s ease;
  }
  .day-card:active { transform: scale(.985); background: var(--surface-2); }
  .day-card .day-label { font-size: 13px; color: var(--accent); font-weight: 700; letter-spacing: .8px; text-transform: uppercase; }
  .day-card .day-name { font-size: 21px; font-weight: 700; margin-top: 3px; }
  .day-card .day-sub { font-size: 13px; color: var(--muted); margin-top: 5px; }
  .chevron { color: var(--muted); font-size: 26px; }

  .section-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; font-weight: 700; margin: 8px 2px 12px; }

  .exercise { margin-bottom: 16px; }
  .exercise:last-child { margin-bottom: 0; }
  .ex-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; gap: 10px; }
  .ex-name { font-size: 18px; font-weight: 700; }
  .ex-target { font-size: 13px; color: var(--muted); white-space: nowrap; font-weight: 600; }

  .set-row {
    display: grid;
    grid-template-columns: 34px 1fr 1fr;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .set-num {
    font-size: 14px; color: var(--muted); font-weight: 700; text-align: center;
  }
  .field { position: relative; }
  .field input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 11px;
    color: var(--text);
    font-size: 19px;
    font-weight: 600;
    padding: 14px 10px 14px 12px;
    text-align: center;
    -moz-appearance: textfield;
  }
  .field input::-webkit-outer-spin-button,
  .field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .field input:focus { outline: none; border-color: var(--accent); background: #20283a; }
  .field input::placeholder { color: #4d5666; font-weight: 500; }
  .field .unit {
    position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
    font-size: 11px; color: var(--muted); pointer-events: none; font-weight: 700; text-transform: uppercase;
  }
  .prog-banner {
    display: flex; align-items: center; gap: 9px;
    border-radius: 11px;
    padding: 11px 13px;
    margin-bottom: 12px;
    font-size: 14.5px;
    line-height: 1.35;
  }
  .prog-banner .pb-icon { font-size: 16px; flex-shrink: 0; }
  .prog-banner.progress {
    background: rgba(52,211,153,0.13);
    border: 1px solid rgba(52,211,153,0.55);
    color: var(--good);
    font-weight: 700;
  }
  .prog-banner.match {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--muted);
    font-weight: 600;
  }
  .prog-banner.match b { color: var(--text); }
  .inc-btn {
    background: rgba(52,211,153,0.16);
    border: 1px solid rgba(52,211,153,0.5);
    color: var(--good);
    font: inherit; font-weight: 700;
    border-radius: 8px;
    padding: 3px 9px;
    margin-left: 4px;
    cursor: pointer;
    white-space: nowrap;
  }
  .inc-btn:active { opacity: .7; }

  .last {
    grid-column: 2 / 4;
    font-size: 12.5px;
    color: var(--muted);
    margin: -2px 0 2px 0;
    padding-left: 2px;
  }
  .last b { color: var(--gold); font-weight: 700; }

  .col-head { display: grid; grid-template-columns: 34px 1fr 1fr; gap: 8px; margin-bottom: 6px; }
  .col-head span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; text-align: center; font-weight: 700; }
  .col-head span:first-child { text-align: center; }

  textarea {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 11px;
    color: var(--text);
    font-size: 16px;
    padding: 13px;
    font-family: inherit;
    resize: vertical;
    min-height: 70px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }

  .btn {
    display: block; width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 18px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
  }
  .btn:active { opacity: .85; }
  .btn.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .btn.danger-text { background: none; color: var(--danger); font-size: 15px; padding: 14px; }

  .sticky-foot {
    position: sticky; bottom: 0;
    padding: 14px 0 calc(env(safe-area-inset-bottom) + 8px);
    background: linear-gradient(to top, var(--bg) 60%, transparent);
  }

  .lead { color: var(--muted); font-size: 15px; margin: 0 2px 14px; line-height: 1.4; }
  .info-card { border-left: 3px solid var(--accent); }
  .info-h { font-size: 13px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .5px; }
  .info-b { font-size: 15px; color: var(--text); margin-top: 6px; line-height: 1.45; }

  .check-item {
    display: flex; align-items: center; gap: 14px;
    padding: 15px 2px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .check-item:last-child { border-bottom: none; padding-bottom: 2px; }
  .check-box {
    width: 28px; height: 28px; border-radius: 9px;
    border: 2px solid var(--border);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; color: transparent;
    transition: all .12s ease;
  }
  .check-item:active .check-box { border-color: var(--accent); }
  .check-item.done .check-box { background: var(--good); border-color: var(--good); color: #06281c; }
  .ci-text { font-size: 16.5px; font-weight: 600; }
  .check-item.done .ci-text { color: var(--muted); }
  .check-item.done .ci-main { text-decoration: line-through; }
  .ci-detail { display: block; font-size: 13px; color: var(--muted); font-weight: 500; margin-top: 2px; text-decoration: none; }

  .fld-label { display: block; font-size: 13px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin: 18px 2px 10px; }
  .fld-label.first { margin-top: 0; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 9px; }
  .chip {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 11px; padding: 14px 16px; font-size: 16px; font-weight: 600;
    cursor: pointer; flex: 1; text-align: center; min-width: calc(50% - 5px);
  }
  .chip:active { opacity: .8; }
  .chip.sel { background: var(--accent-dim); border-color: var(--accent); color: #cfe0ff; }
  .chip.mini { flex: 0 0 auto; min-width: 0; padding: 9px 15px; font-size: 14px; }
  .cardio-card .day-label { color: var(--gold); }

  .progress-card .day-label { color: var(--good); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--surface-2); border: 1px solid var(--border); border-radius: 11px; padding: 13px 6px; text-align: center; }
  .stat .s-val { font-size: 22px; font-weight: 800; }
  .stat .s-lbl { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin-top: 4px; font-weight: 700; }
  .togo { text-align: center; font-size: 17px; font-weight: 700; color: var(--gold); margin: 2px 0 14px; }
  .togo.done { color: var(--good); }
  .pbar { height: 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .pbar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--good)); border-radius: 10px; transition: width .4s ease; }
  .pbar-ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; font-weight: 600; }
  .chart-empty { color: var(--muted); text-align: center; padding: 30px 10px; font-size: 14px; line-height: 1.4; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; justify-content: center; }
  .legend span { font-size: 12px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .legend i { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }
  .wi-item { display: flex; align-items: center; justify-content: space-between; padding: 13px 2px; border-bottom: 1px solid var(--border); }
  .wi-item:last-child { border-bottom: none; }
  .wi-date { font-size: 15px; font-weight: 700; }
  .wi-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .wi-del { background: none; border: none; color: var(--danger); font-size: 22px; cursor: pointer; padding: 6px 12px; line-height: 1; }
  .std-input { width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); font-size: 18px; padding: 14px; border-radius: 11px; font-family: inherit; font-weight: 600; }
  .std-input:focus { outline: none; border-color: var(--accent); }
  .report-text {
    width: 100%; min-height: 58vh;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 11px; padding: 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px; line-height: 1.55; white-space: pre; overflow: auto;
  }
  .report-text:focus { outline: none; border-color: var(--accent); }

  .empty { text-align: center; color: var(--muted); padding: 50px 20px; }
  .empty .big { font-size: 46px; margin-bottom: 12px; }

  .hist-item { cursor: pointer; }
  .hist-item:active { background: var(--surface-2); }
  .hist-top { display: flex; justify-content: space-between; align-items: center; }
  .hist-date { font-size: 17px; font-weight: 700; }
  .hist-day { font-size: 13px; color: var(--accent); font-weight: 700; margin-top: 3px; }
  .hist-meta { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .hist-note { font-size: 14px; color: var(--text); margin-top: 10px; font-style: italic; background: var(--surface-2); padding: 10px 12px; border-radius: 10px; }

  .detail-ex { margin-bottom: 16px; }
  .detail-ex .ex-name { font-size: 16px; margin-bottom: 6px; }
  .detail-sets { display: flex; flex-wrap: wrap; gap: 7px; }
  .set-pill {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 9px; padding: 7px 11px; font-size: 14px; font-weight: 600;
  }
  .set-pill .x { color: var(--muted); font-weight: 400; }

  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px);
    transform: translateX(-50%) translateY(20px);
    background: var(--good); color: #06281c;
    padding: 14px 22px; border-radius: 30px; font-weight: 700; font-size: 16px;
    opacity: 0; pointer-events: none; transition: all .3s ease; z-index: 100;
    box-shadow: 0 8px 30px rgba(0,0,0,.4);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .fade { animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="back-btn" id="backBtn" style="display:none" onclick="goHome()">‹ Back</button>
    <h1 id="title">Lift Log</h1>
    <button class="nav-tab" id="histTab" onclick="showHistory()">History</button>
  </header>
  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Program data ---------- */
const PROGRAM = [
  { key: "upperA", label: "Day 1", name: "Upper A", exercises: [
    { name: "Barbell Bench Press", sets: 4, reps: "5-6" },
    { name: "Barbell Row", sets: 4, reps: "6-8" },
    { name: "Overhead Press", sets: 3, reps: "6-8" },
    { name: "Lat Pulldown", sets: 3, reps: "8-10" },
    { name: "Incline Dumbbell Press", sets: 3, reps: "8-10" },
    { name: "Barbell/DB Curl", sets: 3, reps: "10-12" },
    { name: "Triceps Pushdown", sets: 3, reps: "10-12" },
  ]},
  { key: "lowerA", label: "Day 2", name: "Lower A", exercises: [
    { name: "Barbell Back Squat", sets: 4, reps: "5-6" },
    { name: "Romanian Deadlift", sets: 3, reps: "6-8" },
    { name: "Leg Press", sets: 3, reps: "10-12" },
    { name: "Leg Curl", sets: 3, reps: "10-12" },
    { name: "Standing Calf Raise", sets: 4, reps: "12-15" },
    { name: "Hanging Leg Raise", sets: 3, reps: "12-15" },
  ]},
  { key: "upperB", label: "Day 3", name: "Upper B", exercises: [
    { name: "Incline Barbell/DB Press", sets: 4, reps: "8-10" },
    { name: "Pull-Ups or Lat Pulldown", sets: 4, reps: "8-10" },
    { name: "Seated Cable Row", sets: 3, reps: "10-12" },
    { name: "Dumbbell Shoulder Press", sets: 3, reps: "10-12" },
    { name: "Lateral Raises", sets: 3, reps: "12-15" },
    { name: "Hammer Curls", sets: 3, reps: "10-12" },
    { name: "Overhead Triceps Extension", sets: 3, reps: "10-12" },
  ]},
  { key: "lowerB", label: "Day 4", name: "Lower B", exercises: [
    { name: "Deadlift", sets: 4, reps: "4-6" },
    { name: "Hack Squat or Leg Press", sets: 3, reps: "8-10" },
    { name: "Walking Lunges", sets: 3, reps: "10-12 / leg" },
    { name: "Leg Extension", sets: 3, reps: "12-15" },
    { name: "Seated Calf Raise", sets: 4, reps: "15" },
    { name: "Cable Crunch", sets: 3, reps: "12-15" },
  ]},
];

/* ---------- Warm-up / Cool-down (baked in) ---------- */
const WARMUP = {
  upper: [
    { t: "Arm circles", d: "10 forward / 10 back" },
    { t: "Band pull-aparts", d: "10" },
    { t: "Shoulder pass-throughs", d: "band / dowel / towel — 10" },
    { t: "Cat-Cow", d: "8 slow" },
    { t: "Wall slides", d: "10" },
    { t: "Light push-ups", d: "8-10" },
  ],
  lower: [
    { t: "Bodyweight squats", d: "15" },
    { t: "Leg swings", d: "10 per leg, each direction" },
    { t: "Hip circles / 90-90 rotations", d: "8 per side" },
    { t: "Glute bridges", d: "15" },
    { t: "Bird dogs", d: "8 per side" },
    { t: "Cat-Cow", d: "8 slow" },
  ],
};
const COOLDOWN = {
  upper: [
    { t: "Doorway / chest stretch", d: "30 sec" },
    { t: "Cross-body shoulder stretch", d: "30 sec per side" },
    { t: "Overhead triceps stretch", d: "30 sec per side" },
    { t: "Lat stretch", d: "30 sec per side" },
    { t: "Neck stretch", d: "20 sec per side" },
    { t: "Child's pose", d: "45 sec" },
  ],
  lower: [
    { t: "Standing quad stretch", d: "30 sec per side" },
    { t: "Hamstring stretch", d: "30 sec per side" },
    { t: "Hip-flexor / kneeling lunge stretch", d: "30 sec per side" },
    { t: "Figure-4 glute stretch", d: "30 sec per side" },
    { t: "Calf stretch", d: "30 sec per side" },
    { t: "Child's pose", d: "45 sec" },
  ],
};
function dayType(dayKey) { return dayKey.indexOf("upper") === 0 ? "upper" : "lower"; }

/* ---------- Storage ---------- */
const STORE_KEY = "liftlog.sessions.v1";
function loadSessions() {
  try {
    const arr = JSON.parse(localStorage.getItem(STORE_KEY)) || [];
    // newest first by date (keeps backfilled sessions in correct order)
    return arr.sort((a, b) => new Date(b.date) - new Date(a.date));
  }
  catch (e) { return []; }
}
function saveSessions(arr) {
  localStorage.setItem(STORE_KEY, JSON.stringify(arr));
}
// Most recent session for a given day key (sessions stored newest-first)
function lastSessionFor(dayKey) {
  return loadSessions().find(s => s.dayKey === dayKey) || null;
}

/* ---------- Weigh-in / goals storage ---------- */
const GOALS_KEY = "liftlog.goals.v1";
const WEIGH_KEY = "liftlog.weighins.v1";
function loadGoals() {
  try {
    const g = JSON.parse(localStorage.getItem(GOALS_KEY));
    if (g && typeof g.start === "number") return g;
  } catch (e) {}
  return { start: 212, goal: 207, unit: "lb" }; // pre-filled defaults
}
function saveGoals(g) { localStorage.setItem(GOALS_KEY, JSON.stringify(g)); }
function loadWeighIns() {
  try {
    const arr = JSON.parse(localStorage.getItem(WEIGH_KEY)) || [];
    return arr.sort((a, b) => new Date(b.date) - new Date(a.date)); // newest first
  } catch (e) { return []; }
}
function saveWeighIns(arr) { localStorage.setItem(WEIGH_KEY, JSON.stringify(arr)); }

/* ---------- Auto-progression ---------- */
// Top of a rep range string: "5-6"->6, "12-15"->15, "10-12 / leg"->12, "15"->15
function topOfRange(reps) {
  const nums = String(reps).match(/\d+/g);
  if (!nums) return Infinity; // can't parse -> never auto-progress
  return Math.max(...nums.map(Number));
}
// Default weight jump: bigger for the big lower-body compound lifts
function defaultIncrement(name) {
  const n = name.toLowerCase();
  const big = /squat|deadlift|leg press/.test(n);
  return big ? 10 : 5;
}
const INC_KEY = "liftlog.increments.v1";
function loadIncrements() {
  try { return JSON.parse(localStorage.getItem(INC_KEY)) || {}; }
  catch (e) { return {}; }
}
function getIncrement(name) {
  const o = loadIncrements();
  return (name in o) ? o[name] : defaultIncrement(name);
}
function setIncrementVal(name, val) {
  const o = loadIncrements();
  o[name] = val;
  localStorage.setItem(INC_KEY, JSON.stringify(o));
}
// Base weight from last session: uniform=true if every set used the same weight
function baseWeight(lastEx) {
  const ws = lastEx.sets.map(s => Number(s.weight));
  const uniform = ws.every(w => w === ws[0]);
  return { uniform: uniform, weight: ws[0], max: Math.max(...ws) };
}
// Did every set hit the top of the range last time? (needs reps >= top AND a logged weight)
function didProgress(ex, lastEx) {
  if (!lastEx || !lastEx.sets.length) return false;
  const top = topOfRange(ex.reps);
  return lastEx.sets.every(st =>
    st.weight !== "" && st.reps !== "" && Number(st.reps) >= top
  );
}

/* ---------- Helpers ---------- */
let currentDay = null; // day being viewed in an active session
let pendingSession = null; // workout data captured at Finish, saved after cool-down
const view = document.getElementById("view");
const titleEl = document.getElementById("title");
const backBtn = document.getElementById("backBtn");
const histTab = document.getElementById("histTab");

function esc(s){ return (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric', year:'numeric' });
}
function fmtDateShort(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
}
function daysAgo(iso) {
  const ms = Date.now() - new Date(iso).getTime();
  const d = Math.floor(ms / 86400000);
  if (d <= 0) return "today";
  if (d === 1) return "yesterday";
  if (d < 7) return d + " days ago";
  if (d < 14) return "1 week ago";
  return Math.floor(d/7) + " weeks ago";
}

// Trim to at most 1 decimal, no trailing ".0"
function fmtNum(n) { return (Math.round(Number(n) * 10) / 10).toString(); }

// Local YYYY-MM-DD for <input type="date">
function todayInputVal() {
  const d = new Date();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${d.getFullYear()}-${m}-${day}`;
}
// "YYYY-MM-DD" -> local-noon ISO (noon avoids timezone day-shift)
function inputDateToISO(val) {
  const p = val.split("-").map(Number);
  return new Date(p[0], p[1] - 1, p[2], 12, 0, 0).toISOString();
}
// Cardio totals over the last 7 days
function cardioThisWeek() {
  const cutoff = Date.now() - 7 * 86400000;
  let min = 0, count = 0;
  loadSessions().forEach(s => {
    if (s.kind === "cardio" && new Date(s.date).getTime() >= cutoff) {
      min += Number(s.duration) || 0;
      count++;
    }
  });
  return { min, count };
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
}

function setHeader(title, showBack) {
  titleEl.textContent = title;
  backBtn.style.display = showBack ? "block" : "none";
}

/* ---------- Home ---------- */
function goHome() {
  setHeader("Lift Log", false);
  histTab.classList.remove("active");
  const sessions = loadSessions();
  let html = `<div class="fade">`;
  html += `<div class="section-title">Choose today's workout</div>`;
  PROGRAM.forEach(day => {
    const last = sessions.find(s => s.dayKey === day.key);
    const sub = last ? `Last done ${daysAgo(last.date)}` : "Not done yet";
    html += `
      <div class="card day-card" onclick="showWarmup('${day.key}')">
        <div>
          <div class="day-label">${day.label}</div>
          <div class="day-name">${esc(day.name)}</div>
          <div class="day-sub">${day.exercises.length} exercises · ${sub}</div>
        </div>
        <div class="chevron">›</div>
      </div>`;
  });
  const lastCardio = sessions.find(s => s.kind === "cardio");
  const cardioSub = lastCardio ? `last done ${daysAgo(lastCardio.date)}` : "not done yet";
  const wk = cardioThisWeek();
  const wkText = wk.min > 0 ? `${wk.min} min this week · ${cardioSub}` : `Treadmill, bike, stairs… · ${cardioSub}`;
  html += `
    <div class="section-title" style="margin-top:22px">Or log cardio</div>
    <div class="card day-card cardio-card" onclick="showCardio()">
      <div>
        <div class="day-label">Cardio</div>
        <div class="day-name">🏃 Cardio Session</div>
        <div class="day-sub">${wkText}</div>
      </div>
      <div class="chevron">›</div>
    </div>`;

  const goals = loadGoals();
  const wis = loadWeighIns();
  const latest = wis.length ? Number(wis[0].weight) : goals.start;
  const remain = Math.abs(latest - goals.goal);
  const reached = (goals.goal <= goals.start) ? (latest <= goals.goal) : (latest >= goals.goal);
  const progSub = wis.length
    ? (reached ? "Goal reached! 🎉" : `${fmtNum(latest)} ${goals.unit} · ${fmtNum(remain)} ${goals.unit} to go`)
    : "No weigh-ins yet";
  html += `
    <div class="section-title" style="margin-top:22px">Body weight</div>
    <div class="card day-card progress-card" onclick="showProgress()">
      <div>
        <div class="day-label">Weigh-In</div>
        <div class="day-name">⚖️ Weight &amp; Progress</div>
        <div class="day-sub">${progSub}</div>
      </div>
      <div class="chevron">›</div>
    </div>`;
  html += `
    <button class="btn" style="margin-top:24px" onclick="showCoachReport()">📋 Generate Coach Report</button>`;
  html += `</div>`;
  view.innerHTML = html;
  window.scrollTo(0,0);
}

      <div class="ci-text"><span class="ci-main">${esc(x.t)}</span><span class="ci-detail">${esc(x.d)}</span></div>

}

/* ---------- Session (active workout) ---------- */
function openSession(dayKey, prefill) {
  const day = PROGRAM.find(d => d.key === dayKey);
  currentDay = day;
  const last = lastSessionFor(dayKey);
  setHeader(day.name, true);
  backBtn.setAttribute("onclick", "goHome()");
  histTab.classList.remove("active");

  let html = `<div class="fade">`;
  if (last) {
    html += `<div class="section-title">Beat your last session — ${fmtDateShort(last.date)}</div>`;
  } else {
    html += `<div class="section-title">First time — set your baseline</div>`;
  }

  day.exercises.forEach((ex, ei) => {
    const lastEx = last ? last.exercises.find(e => e.name === ex.name) : null;
    let banner = "";
    if (lastEx) {
      if (didProgress(ex, lastEx)) {
        const inc = getIncrement(ex.name);
        const base = baseWeight(lastEx);
        const suggest = base.uniform
          ? `Try <span id="tgt-${ei}">${base.weight + inc}</span> lb today`
          : `Add weight today`;
        banner = `<div class="prog-banner progress">
          <span class="pb-icon">▲</span>
          <span>Progress! ${suggest}
            <button class="inc-btn" onclick="editIncrement(${ei})">+<span id="inc-${ei}">${inc}</span> lb ✎</button>
          </span></div>`;
      } else {
        banner = `<div class="prog-banner match">
          <span class="pb-icon">→</span>
          <span>Match or beat last time — see your numbers below.</span></div>`;
      }
    }
    html += `<div class="card exercise" data-ex="${ei}" data-name="${esc(ex.name)}">
      <div class="ex-head">
        <div class="ex-name">${esc(ex.name)}</div>
        <div class="ex-target">${ex.sets} × ${ex.reps}</div>
      </div>
      ${banner}
      <div class="col-head"><span>Set</span><span>Weight</span><span>Reps</span></div>`;
    for (let s = 0; s < ex.sets; s++) {
      const prev = lastEx && lastEx.sets[s];
      const pre = prefill && prefill.exercises[ei] && prefill.exercises[ei].sets[s];
      const preW = pre && pre.weight !== "" ? esc(String(pre.weight)) : "";
      const preR = pre && pre.reps !== "" ? esc(String(pre.reps)) : "";
      const lastTxt = (prev && (prev.weight !== "" || prev.reps !== ""))
        ? `Last: <b>${esc(String(prev.weight||"–"))} × ${esc(String(prev.reps||"–"))}</b>`
        : `Last: <b>—</b>`;
      html += `
        <div class="set-row">
          <div class="set-num">${s+1}</div>
          <div class="field">
            <input type="number" inputmode="decimal" step="any" value="${preW}" placeholder="${prev&&prev.weight!==""?esc(String(prev.weight)):'0'}" data-w="${ei}-${s}">
            <span class="unit">wt</span>
          </div>
          <div class="field">
            <input type="number" inputmode="numeric" value="${preR}" placeholder="${prev&&prev.reps!==""?esc(String(prev.reps)):'0'}" data-r="${ei}-${s}">
            <span class="unit">rep</span>
          </div>
        </div>
        <div class="last">${lastTxt}</div>`;
    }
    html += `</div>`;
  });

  html += `<div class="card">
      <div class="section-title" style="margin-top:0">Session note</div>
      <textarea id="note" placeholder="How did it feel? Energy, sleep, pumps, aches…">${prefill ? esc(prefill.note) : ""}</textarea>
    </div>`;

  html += `<div class="sticky-foot">
      <button class="btn" onclick="finishWorkout('${dayKey}')">Finish Workout</button>
    </div></div>`;

  view.innerHTML = html;
  window.scrollTo(0,0);
}

function finishWorkout(dayKey) {
  const day = PROGRAM.find(d => d.key === dayKey);
  const exercises = [];
  let anyEntry = false;

  day.exercises.forEach((ex, ei) => {
    const sets = [];
    for (let s = 0; s < ex.sets; s++) {
      const w = document.querySelector(`[data-w="${ei}-${s}"]`).value.trim();
      const r = document.querySelector(`[data-r="${ei}-${s}"]`).value.trim();
      if (w !== "" || r !== "") anyEntry = true;
      sets.push({ weight: w, reps: r });
    }
    exercises.push({ name: ex.name, sets });
  });

  if (!anyEntry) {
    if (!confirm("You haven't logged any sets. Save this empty workout anyway?")) return;
  }

  const note = document.getElementById("note").value.trim();
  // hold the workout; it's saved after the cool-down screen
  pendingSession = {
    dayKey: dayKey,
    dayName: day.name,
    dayLabel: day.label,
    note: note,
    exercises: exercises,
  };
  showCooldown(dayKey);
}

/* ---------- Cool-Down screen ---------- */
function showCooldown(dayKey) {
  const day = PROGRAM.find(d => d.key === dayKey);
  setHeader(day.name + " · Cool-Down", true);
  // back returns to the workout with everything you entered still filled in
  backBtn.setAttribute("onclick", "openSession('" + dayKey + "', pendingSession)");
  const drills = COOLDOWN[dayType(dayKey)];

  view.innerHTML = `<div class="fade">
    <p class="lead">Cool down — about 5 min. Easy breathing, gentle stretches.</p>
    <div class="card info-card">
      <div class="info-h">General · 2-3 min</div>
      <div class="info-b">Easy walk or slow cardio to bring your heart rate down.</div>
    </div>
    <div class="card">
      <div class="section-title" style="margin-top:0">Stretches — hold, don't bounce</div>
      ${checklistHtml(drills)}
    </div>
    <div class="sticky-foot">
      <button class="btn" onclick="commitSession()">Finish &amp; Save</button>
    </div>
  </div>`;
  window.scrollTo(0, 0);
}

function commitSession() {
  if (!pendingSession) return goHome();
  pendingSession.id = Date.now();
  pendingSession.date = new Date().toISOString();
  const all = loadSessions();
  all.unshift(pendingSession); // newest first
  saveSessions(all);
  pendingSession = null;
  toast("✓ Workout saved!");
  goHome();
}

// Override the suggested weight jump for an exercise (persists per exercise)
function editIncrement(ei) {
  if (!currentDay) return;
  const ex = currentDay.exercises[ei];
  const cur = getIncrement(ex.name);
  const v = prompt(`Weight jump for "${ex.name}" (lb):`, cur);
  if (v === null) return;
  const num = parseFloat(v);
  if (isNaN(num) || num < 0) { alert("Please enter a valid number."); return; }
  setIncrementVal(ex.name, num);
  const span = document.getElementById("inc-" + ei);
  if (span) span.textContent = num;
  // update the suggested target weight if it's shown
  const tgt = document.getElementById("tgt-" + ei);
  if (tgt) {
    const lastEx = (lastSessionFor(currentDay.key) || {exercises:[]})
      .exercises.find(e => e.name === ex.name);
    if (lastEx) tgt.textContent = baseWeight(lastEx).weight + num;
  }
  toast("Jump set to +" + num + " lb");
}

function selectChip(el) {
  const row = el.parentElement;
  row.querySelectorAll(".chip").forEach(c => c.classList.remove("sel"));
  el.classList.add("sel");
}

function saveCardio() {
  const typeEl = document.querySelector("#ctype .chip.sel");
  const type = typeEl ? typeEl.dataset.val : "";
  const dur = document.getElementById("cdur").value.trim();
  const intensity = document.getElementById("cint").value.trim();
  const dateVal = document.getElementById("cdate").value;
  if (!type) { alert("Pick a cardio type."); return; }
  if (dur === "" || Number(dur) <= 0) { alert("Enter how many minutes you did."); return; }

  const session = {
    id: Date.now(),
    date: dateVal ? inputDateToISO(dateVal) : new Date().toISOString(),
    kind: "cardio",
    cardioType: type,
    duration: Number(dur),
    intensity: intensity,
  };
  const all = loadSessions();
  all.unshift(session); // newest first
  saveSessions(all);
  toast("✓ Cardio saved!");
  goHome();
}

/* ---------- Weigh-In / Progress ---------- */
// 7-day trailing average for each point (entries sorted ascending by time)
function rollingAvg(pts) {
  return pts.map((e, i) => {
    const win = pts.filter((x, j) => j <= i && x.t >= e.t - 6 * 86400000);
    return win.reduce((s, x) => s + x.weight, 0) / win.length;
  });
}

// Build an inline-SVG line chart (weight, 7-day avg, optional waist trend)
function progressChartSVG() {
  const all = loadWeighIns().slice().sort((a, b) => new Date(a.date) - new Date(b.date));
  const pts = all.map(e => ({
    t: new Date(e.date).getTime(),
    weight: Number(e.weight),
    waist: (e.waist !== "" && e.waist != null) ? Number(e.waist) : null,
  }));
  if (pts.length < 2) {
    return `<div class="chart-empty">Log at least two weigh-ins and your weight trend will appear here.</div>`;
  }
  const goals = loadGoals();
  const W = 340, H = 200, padL = 34, padR = 12, padT = 12, padB = 26;
  const t0 = pts[0].t, tN = pts[pts.length - 1].t, xspan = (tN - t0) || 1;
  const X = t => padL + (t - t0) / xspan * (W - padL - padR);

  const weights = pts.map(p => p.weight);
  let ymin = Math.min(...weights, goals.goal);
  let ymax = Math.max(...weights, goals.goal);
  const pad = Math.max(0.5, (ymax - ymin) * 0.12);
  ymin -= pad; ymax += pad;
  const Y = v => padT + (ymax - v) / (ymax - ymin) * (H - padT - padB);

  const avg = rollingAvg(pts);
  const wLine = pts.map(p => `${X(p.t).toFixed(1)},${Y(p.weight).toFixed(1)}`).join(" ");
  const aLine = pts.map((p, i) => `${X(p.t).toFixed(1)},${Y(avg[i]).toFixed(1)}`).join(" ");
  const dots = pts.map(p => `<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.weight).toFixed(1)}" r="2.6" fill="var(--accent)"/>`).join("");
  const yG = Y(goals.goal);

  // optional waist line on its own scale
  let waistSVG = "", waistLegend = "";
  const wp = pts.filter(p => p.waist != null);
  if (wp.length >= 2) {
    let wmin = Math.min(...wp.map(p => p.waist)), wmax = Math.max(...wp.map(p => p.waist));
    const wr = (wmax - wmin) || 1;
    wmin -= wr * 0.15; wmax += wr * 0.15;
    const WY = v => padT + (wmax - v) / (wmax - wmin) * (H - padT - padB);
    const waistLine = wp.map(p => `${X(p.t).toFixed(1)},${WY(p.waist).toFixed(1)}`).join(" ");
    waistSVG = `<polyline points="${waistLine}" fill="none" stroke="var(--good)" stroke-width="2" stroke-dasharray="1 0" opacity="0.9"/>`;
    waistLegend = `<span><i style="background:var(--good)"></i>Waist (in)</span>`;
  }

  return `
    <svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">
      <line x1="${padL}" y1="${yG.toFixed(1)}" x2="${W - padR}" y2="${yG.toFixed(1)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4" opacity="0.7"/>
      <text x="${W - padR}" y="${(yG - 4).toFixed(1)}" fill="var(--muted)" font-size="9" text-anchor="end">goal ${fmtNum(goals.goal)}</text>
      <text x="4" y="${(padT + 8).toFixed(1)}" fill="var(--muted)" font-size="9">${fmtNum(ymax)}</text>
      <text x="4" y="${(H - padB + 2).toFixed(1)}" fill="var(--muted)" font-size="9">${fmtNum(ymin)}</text>
      <text x="${padL}" y="${(H - 8).toFixed(1)}" fill="var(--muted)" font-size="9" text-anchor="start">${fmtDateShort(all[0].date)}</text>
      <text x="${W - padR}" y="${(H - 8).toFixed(1)}" fill="var(--muted)" font-size="9" text-anchor="end">${fmtDateShort(all[all.length - 1].date)}</text>
      <polyline points="${aLine}" fill="none" stroke="var(--gold)" stroke-width="2.5"/>
      <polyline points="${wLine}" fill="none" stroke="var(--accent)" stroke-width="1.5" opacity="0.6"/>
      ${dots}
      ${waistSVG}
    </svg>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>Weight</span>
      <span><i style="background:var(--gold)"></i>7-day avg</span>
      ${waistLegend}
    </div>`;
}

function showProgress() {
  currentDay = null;
  setHeader("Weight & Progress", true);
  backBtn.setAttribute("onclick", "goHome()");
  histTab.classList.remove("active");

  const goals = loadGoals();
  const wis = loadWeighIns();
  const latest = wis.length ? Number(wis[0].weight) : goals.start;
  const remain = Math.abs(latest - goals.goal);
  const span = goals.goal - goals.start;
  let frac = span === 0 ? 1 : (latest - goals.start) / span;
  frac = Math.max(0, Math.min(1, frac));
  const reached = frac >= 1;
  const togoText = !wis.length ? "Log your first weigh-in below"
    : reached ? "Goal reached! 🎉"
    : `${fmtNum(remain)} ${goals.unit} to go`;

  let entriesHtml = "";
  if (wis.length) {
    wis.forEach(e => {
      const waist = (e.waist !== "" && e.waist != null) ? ` · waist ${fmtNum(e.waist)} in` : "";
      entriesHtml += `<div class="wi-item">
        <div>
          <div class="wi-date">${fmtNum(e.weight)} ${goals.unit}</div>
          <div class="wi-sub">${fmtDate(e.date)}${waist}</div>
        </div>
        <button class="wi-del" onclick="deleteWeighIn(${e.id})">✕</button>
      </div>`;
    });
  } else {
    entriesHtml = `<div class="chart-empty">No weigh-ins yet.</div>`;
  }

  view.innerHTML = `<div class="fade">
    <div class="card">
      <div class="stat-grid">
        <div class="stat"><div class="s-val">${fmtNum(goals.start)}</div><div class="s-lbl">Start</div></div>
        <div class="stat"><div class="s-val">${fmtNum(latest)}</div><div class="s-lbl">Latest</div></div>
        <div class="stat"><div class="s-val">${fmtNum(goals.goal)}</div><div class="s-lbl">Goal</div></div>
      </div>
      <div class="togo ${reached ? "done" : ""}">${togoText}</div>
      <div class="pbar"><div class="pbar-fill" style="width:${(frac * 100).toFixed(0)}%"></div></div>
      <div class="pbar-ends"><span>${fmtNum(goals.start)} ${goals.unit}</span><span>${fmtNum(goals.goal)} ${goals.unit}</span></div>
      <button class="btn secondary" style="margin-top:16px" onclick="editGoals()">Edit start / goal</button>
    </div>

    <div class="card">
      <div class="section-title" style="margin-top:0">Trend</div>
      <div class="chart-wrap">${progressChartSVG()}</div>
    </div>

    <div class="card">
      <div class="section-title" style="margin-top:0">Log a weigh-in</div>
      <label class="fld-label first">Date</label>
      <input type="date" id="widate" class="std-input" value="${todayInputVal()}" max="${todayInputVal()}">
      <label class="fld-label">Body weight (${goals.unit})</label>
      <input type="number" inputmode="decimal" step="any" id="wiwt" class="std-input" placeholder="${fmtNum(latest)}">
      <label class="fld-label">Waist (inches) — optional</label>
      <input type="number" inputmode="decimal" step="any" id="wiwaist" class="std-input" placeholder="e.g. 38">
      <button class="btn" style="margin-top:16px" onclick="saveWeighIn()">Save Weigh-In</button>
    </div>

    <div class="card">
      <div class="section-title" style="margin-top:0">All entries</div>
      ${entriesHtml}
    </div>
  </div>`;
  window.scrollTo(0, 0);
}

function saveWeighIn() {
  const date = document.getElementById("widate").value;
  const wt = document.getElementById("wiwt").value.trim();
  const waist = document.getElementById("wiwaist").value.trim();
  if (wt === "" || Number(wt) <= 0) { alert("Enter your body weight."); return; }
  if (waist !== "" && Number(waist) <= 0) { alert("Waist must be a positive number, or leave it blank."); return; }
  const entry = {
    id: Date.now(),
    date: date ? inputDateToISO(date) : new Date().toISOString(),
    weight: Number(wt),
    waist: waist === "" ? "" : Number(waist),
  };
  const all = loadWeighIns();
  all.unshift(entry);
  saveWeighIns(all);
  toast("✓ Weigh-in saved!");
  showProgress();
}

function deleteWeighIn(id) {
  if (!confirm("Delete this weigh-in?")) return;
  saveWeighIns(loadWeighIns().filter(e => e.id !== id));
  toast("Weigh-in deleted");
  showProgress();
}

function editGoals() {
  const g = loadGoals();
  const s = prompt("Starting weight (" + g.unit + "):", g.start);
  if (s === null) return;
  const gv = prompt("Goal weight (" + g.unit + "):", g.goal);
  if (gv === null) return;
  const sn = parseFloat(s), gn = parseFloat(gv);
  if (isNaN(sn) || isNaN(gn) || sn <= 0 || gn <= 0) { alert("Please enter valid weights."); return; }
  saveGoals({ start: sn, goal: gn, unit: g.unit });
  toast("Goals updated");
  showProgress();
}

/* ---------- Coach Report ---------- */
// Top working set of an exercise: heaviest weight, then most reps at that weight
function representativeSet(ex) {
  let best = null;
  ex.sets.forEach(s => {
    if (s.weight === "" || s.reps === "") return;
    const w = Number(s.weight), r = Number(s.reps);
    if (!best || w > best.w || (w === best.w && r > best.r)) best = { w: w, r: r };
  });
  return best;
}

function buildCoachReport() {
  const sessions = loadSessions();                       // newest first
  const lifts = sessions.filter(s => s.kind !== "cardio");
  const cardio = sessions.filter(s => s.kind === "cardio");
  const weighins = loadWeighIns();                       // newest first
  const goals = loadGoals();

  if (!sessions.length && !weighins.length) {
    return "No data logged yet.\n\nLog a few workouts and weigh-ins, then generate your report.";
  }

  const L = [];
  const push = s => L.push(s);
  const heading = t => { push(""); push(t); push("=".repeat(t.length)); };

  // ----- Date range -----
  const times = [];
  sessions.forEach(s => times.push(new Date(s.date).getTime()));
  weighins.forEach(w => times.push(new Date(w.date).getTime()));
  const minT = Math.min(...times), maxT = Math.max(...times);
  const spanDays = Math.round((maxT - minT) / 86400000) + 1;

  push("COACH REPORT");
  push("Generated: " + fmtDate(new Date().toISOString()));
  push("Period:    " + fmtDateShort(new Date(minT).toISOString()) + " - " + fmtDateShort(new Date(maxT).toISOString()) + "  (" + spanDays + " days)");
  push("Workouts logged: " + lifts.length);

  // ----- Exercise trends -----
  heading("EXERCISE TRENDS  (oldest -> newest)");
  const liftsChrono = lifts.slice().sort((a, b) => new Date(a.date) - new Date(b.date));
  const exMap = {};
  liftsChrono.forEach(s => {
    s.exercises.forEach(ex => {
      const r = representativeSet(ex);
      if (!r) return;
      (exMap[ex.name] = exMap[ex.name] || []).push(r);
    });
  });
  const order = [];
  PROGRAM.forEach(d => d.exercises.forEach(e => { if (order.indexOf(e.name) === -1) order.push(e.name); }));
  Object.keys(exMap).forEach(n => { if (order.indexOf(n) === -1) order.push(n); });

  let anyEx = false;
  order.forEach(name => {
    const arr = exMap[name];
    if (!arr || !arr.length) return;
    anyEx = true;
    const recent = arr.slice(-4);
    const str = recent.map(x => fmtNum(x.w) + "x" + x.r).join(", ");
    let stalled = false;
    if (arr.length >= 3) {
      const a = arr[arr.length - 1], b = arr[arr.length - 3];
      if (a.w <= b.w && a.r <= b.r) stalled = true;
    }
    push(name + ": " + str + (stalled ? "   <-- STALLED" : ""));
  });
  if (!anyEx) push("(no logged sets yet)");

  // ----- Body weight -----
  heading("BODY WEIGHT");
  const start = Number(goals.start);
  const current = weighins.length ? Number(weighins[0].weight) : start;
  const change = current - start;
  push("Starting: " + fmtNum(start) + " " + goals.unit);
  push("Current:  " + fmtNum(current) + " " + goals.unit);
  push("Change:   " + (change > 0 ? "+" : "") + fmtNum(change) + " " + goals.unit);
  push("Goal:     " + fmtNum(goals.goal) + " " + goals.unit + "  (" + fmtNum(Math.abs(current - goals.goal)) + " to go)");
  const waist = weighins.filter(w => w.waist !== "" && w.waist != null)
    .sort((a, b) => new Date(a.date) - new Date(b.date));
  if (waist.length >= 2) {
    const f = Number(waist[0].waist), l = Number(waist[waist.length - 1].waist);
    push("Waist:    " + fmtNum(f) + " -> " + fmtNum(l) + " in  (" + (l - f > 0 ? "+" : "") + fmtNum(l - f) + " in)");
  } else if (waist.length === 1) {
    push("Waist:    " + fmtNum(waist[0].waist) + " in");
  }

  // ----- Cardio -----
  heading("CARDIO");
  const totalMin = cardio.reduce((n, c) => n + (Number(c.duration) || 0), 0);
  push("Sessions:   " + cardio.length);
  push("Total time: " + totalMin + " min");
  if (cardio.length) {
    const byType = {};
    cardio.forEach(c => { byType[c.cardioType] = (byType[c.cardioType] || 0) + (Number(c.duration) || 0); });
    const parts = Object.keys(byType).map(t => t + " " + byType[t] + " min");
    push("Breakdown:  " + parts.join(", "));
  }

  // ----- Notes -----
  heading("SESSION NOTES");
  const noted = lifts.filter(s => s.note).sort((a, b) => new Date(a.date) - new Date(b.date));
  if (noted.length) {
    noted.forEach(s => push("- " + fmtDateShort(s.date) + " (" + s.dayName + "): " + s.note));
  } else {
    push("None recorded.");
  }

  // ----- Adherence -----
  heading("ADHERENCE");
  const weeks = Math.max(1, Math.ceil(spanDays / 7));
  const avg = lifts.length / weeks;
  const cutoff = Date.now() - 7 * 86400000;
  const last7 = lifts.filter(s => new Date(s.date).getTime() >= cutoff).length;
  push("Plan: 4 lifting sessions per week");
  push("Last 7 days: " + last7 + " of 4 done");
  push("Overall: " + lifts.length + " workouts over ~" + weeks + " week" + (weeks !== 1 ? "s" : "") + " = " + fmtNum(avg) + "/week");

  push("");
  return L.join("\n");
}

function showCoachReport() {
  currentDay = null;
  setHeader("Coach Report", true);
  backBtn.setAttribute("onclick", "goHome()");
  histTab.classList.remove("active");
  const text = buildCoachReport();
  view.innerHTML = `<div class="fade">
    <p class="lead">Copy this and send it to your coach.</p>
    <button class="btn" onclick="copyReport()">📋 Copy Report</button>
    <div class="card" style="margin-top:14px">
      <textarea id="reportText" class="report-text" readonly>${esc(text)}</textarea>
    </div>
  </div>`;
  window.scrollTo(0, 0);
}

function copyReport() {
  const ta = document.getElementById("reportText");
  const txt = ta.value;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(() => toast("✓ Report copied!"), () => fallbackCopy(ta));
  } else {
    fallbackCopy(ta);
  }
}
function fallbackCopy(ta) {
  ta.removeAttribute("readonly");
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, 999999);
  try {
    document.execCommand("copy");
    toast("✓ Report copied!");
  } catch (e) {
    toast("Tap & hold the text to copy");
  }
  ta.setAttribute("readonly", "readonly");
  window.getSelection().removeAllRanges();
}

/* ---------- History ---------- */
function showHistory() {
  setHeader("History", true);
  histTab.classList.add("active");
  const sessions = loadSessions();

  if (!sessions.length) {
    view.innerHTML = `<div class="empty fade">
      <div class="big">🏋️</div>
      <div>No workouts logged yet.</div>
      <div style="margin-top:8px;font-size:14px">Finish a session and it'll show up here.</div>
    </div>`;
    return;
  }

  let html = `<div class="fade"><div class="section-title">${sessions.length} session${sessions.length>1?'s':''} logged</div>`;
  sessions.forEach(s => {
    if (s.kind === "cardio") {
      html += `<div class="card hist-item" onclick="showDetail(${s.id})">
        <div class="hist-top">
          <div>
            <div class="hist-date">${fmtDate(s.date)}</div>
            <div class="hist-day" style="color:var(--gold)">🏃 Cardio · ${esc(s.cardioType)}</div>
          </div>
          <div class="chevron">›</div>
        </div>
        <div class="hist-meta">${s.duration} min${s.intensity ? ` · ${esc(s.intensity)}` : ""} · ${daysAgo(s.date)}</div>
      </div>`;
      return;
    }
    const setsLogged = s.exercises.reduce((n, e) =>
      n + e.sets.filter(x => x.weight !== "" || x.reps !== "").length, 0);
    html += `<div class="card hist-item" onclick="showDetail(${s.id})">
      <div class="hist-top">
        <div>
          <div class="hist-date">${fmtDate(s.date)}</div>
          <div class="hist-day">${esc(s.dayLabel)} · ${esc(s.dayName)}</div>
        </div>
        <div class="chevron">›</div>
      </div>
      <div class="hist-meta">${setsLogged} set${setsLogged!==1?'s':''} logged · ${daysAgo(s.date)}</div>
      ${s.note ? `<div class="hist-note">“${esc(s.note)}”</div>` : ``}
    </div>`;
  });
  html += `</div>`;
  view.innerHTML = html;
  window.scrollTo(0,0);
}

function showDetail(id) {
  const s = loadSessions().find(x => x.id === id);
  if (!s) return showHistory();

  if (s.kind === "cardio") {
    setHeader("Cardio", true);
    backBtn.setAttribute("onclick", "showHistory()");
    view.innerHTML = `<div class="fade">
      <div class="card">
        <div class="hist-date">${fmtDate(s.date)}</div>
        <div class="hist-day" style="color:var(--gold)">🏃 Cardio · ${esc(s.cardioType)}</div>
      </div>
      <div class="card">
        <div class="detail-ex">
          <div class="ex-name">Duration</div>
          <div class="detail-sets"><span class="set-pill">${s.duration} min</span></div>
        </div>
        <div class="detail-ex" style="margin-bottom:0">
          <div class="ex-name">Intensity</div>
          <div class="detail-sets"><span class="set-pill">${s.intensity ? esc(s.intensity) : "—"}</span></div>
        </div>
      </div>
      <button class="btn danger-text" onclick="deleteSession(${s.id})">Delete this session</button>
    </div>`;
    window.scrollTo(0, 0);
    return;
  }

  setHeader(s.dayName, true);
  backBtn.setAttribute("onclick", "showHistory()");

  let html = `<div class="fade">
    <div class="card">
      <div class="hist-date">${fmtDate(s.date)}</div>
      <div class="hist-day">${esc(s.dayLabel)} · ${esc(s.dayName)}</div>
      ${s.note ? `<div class="hist-note">“${esc(s.note)}”</div>` : ``}
    </div>
    <div class="card">`;

  s.exercises.forEach(ex => {
    const logged = ex.sets.filter(x => x.weight !== "" || x.reps !== "");
    html += `<div class="detail-ex">
      <div class="ex-name">${esc(ex.name)}</div>
      <div class="detail-sets">`;
    if (!logged.length) {
      html += `<span class="set-pill" style="color:var(--muted)">— skipped —</span>`;
    } else {
      ex.sets.forEach(x => {
        if (x.weight === "" && x.reps === "") return;
        html += `<span class="set-pill">${esc(String(x.weight||"–"))} <span class="x">×</span> ${esc(String(x.reps||"–"))}</span>`;
      });
    }
    html += `</div></div>`;
  });

  html += `</div>
    <button class="btn danger-text" onclick="deleteSession(${s.id})">Delete this session</button>
    </div>`;
  view.innerHTML = html;
  window.scrollTo(0,0);
}

function deleteSession(id) {
  if (!confirm("Delete this workout permanently?")) return;
  saveSessions(loadSessions().filter(x => x.id !== id));
  toast("Session deleted");
  showHistory();
}

/* reset back button behaviour when going home */
const _goHome = goHome;
goHome = function(){ backBtn.setAttribute("onclick","goHome()"); _goHome(); };

/* ---------- Init ---------- */
goHome();
</script>
