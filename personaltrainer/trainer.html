<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="theme-color" content="#0d0f14">
<title>Lift Log</title>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161a22;
    --surface-2: #1e242f;
    --border: #2a313d;
    --text: #eef1f6;
    --muted: #8a93a3;
    --accent: #4f8cff;
    --accent-dim: #2b3a57;
    --good: #34d399;
    --gold: #f5b942;
    --danger: #ff5a5a;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: contain;
  }
  body {
    padding-bottom: env(safe-area-inset-bottom);
    min-height: 100vh;
  }
  .app { max-width: 640px; margin: 0 auto; }

  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(13,15,20,0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: calc(env(safe-area-inset-top) + 14px) 16px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 19px; margin: 0; flex: 1; font-weight: 700; letter-spacing: .3px; }
  .back-btn {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 9px 14px;
    font-size: 16px;
    cursor: pointer;
    font-weight: 600;
  }
  .nav-tab {
    background: none; border: none; color: var(--muted);
    font-size: 15px; font-weight: 600; cursor: pointer; padding: 8px 4px;
  }
  .nav-tab.active { color: var(--accent); }

  main { padding: 16px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 14px;
  }

  .day-card {
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer;
    transition: transform .08s ease, background .15s ease;
  }
  .day-card:active { transform: scale(.985); background: var(--surface-2); }
  .day-card .day-label { font-size: 13px; color: var(--accent); font-weight: 700; letter-spacing: .8px; text-transform: uppercase; }
  .day-card .day-name { font-size: 21px; font-weight: 700; margin-top: 3px; }
  .day-card .day-sub { font-size: 13px; color: var(--muted); margin-top: 5px; }
  .chevron { color: var(--muted); font-size: 26px; }

  .section-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; font-weight: 700; margin: 8px 2px 12px; }

  .exercise { margin-bottom: 16px; }
  .exercise:last-child { margin-bottom: 0; }
  .ex-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; gap: 10px; }
  .ex-name { font-size: 18px; font-weight: 700; }
  .ex-target { font-size: 13px; color: var(--muted); white-space: nowrap; font-weight: 600; }

  .set-row {
    display: grid;
    grid-template-columns: 34px 1fr 1fr;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .set-num {
    font-size: 14px; color: var(--muted); font-weight: 700; text-align: center;
  }
  .field { position: relative; }
  .field input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 11px;
    color: var(--text);
    font-size: 19px;
    font-weight: 600;
    padding: 14px 10px 14px 12px;
    text-align: center;
    -moz-appearance: textfield;
  }
  .field input::-webkit-outer-spin-button,
  .field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .field input:focus { outline: none; border-color: var(--accent); background: #20283a; }
  .field input::placeholder { color: #4d5666; font-weight: 500; }
  .field .unit {
    position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
    font-size: 11px; color: var(--muted); pointer-events: none; font-weight: 700; text-transform: uppercase;
  }
  .prog-banner {
    display: flex; align-items: center; gap: 9px;
    border-radius: 11px;
    padding: 11px 13px;
    margin-bottom: 12px;
    font-size: 14.5px;
    line-height: 1.35;
  }
  .prog-banner .pb-icon { font-size: 16px; flex-shrink: 0; }
  .prog-banner.progress {
    background: rgba(52,211,153,0.13);
    border: 1px solid rgba(52,211,153,0.55);
    color: var(--good);
    font-weight: 700;
  }
  .prog-banner.match {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--muted);
    font-weight: 600;
  }
  .prog-banner.match b { color: var(--text); }
  .inc-btn {
    background: rgba(52,211,153,0.16);
    border: 1px solid rgba(52,211,153,0.5);
    color: var(--good);
    font: inherit; font-weight: 700;
    border-radius: 8px;
    padding: 3px 9px;
    margin-left: 4px;
    cursor: pointer;
    white-space: nowrap;
  }
  .inc-btn:active { opacity: .7; }

  .last {
    grid-column: 2 / 4;
    font-size: 12.5px;
    color: var(--muted);
    margin: -2px 0 2px 0;
    padding-left: 2px;
  }
  .last b { color: var(--gold); font-weight: 700; }

  .col-head { display: grid; grid-template-columns: 34px 1fr 1fr; gap: 8px; margin-bottom: 6px; }
  .col-head span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; text-align: center; font-weight: 700; }
  .col-head span:first-child { text-align: center; }

  textarea {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 11px;
    color: var(--text);
    font-size: 16px;
    padding: 13px;
    font-family: inherit;
    resize: vertical;
    min-height: 70px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }

  .btn {
    display: block; width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 18px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
  }
  .btn:active { opacity: .85; }
  .btn.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .btn.danger-text { background: none; color: var(--danger); font-size: 15px; padding: 14px; }

  .sticky-foot {
    position: sticky; bottom: 0;
    padding: 14px 0 calc(env(safe-area-inset-bottom) + 8px);
    background: linear-gradient(to top, var(--bg) 60%, transparent);
  }

  .lead { color: var(--muted); font-size: 15px; margin: 0 2px 14px; line-height: 1.4; }
  .info-card { border-left: 3px solid var(--accent); }
  .info-h { font-size: 13px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .5px; }
  .info-b { font-size: 15px; color: var(--text); margin-top: 6px; line-height: 1.45; }

  .check-item {
    display: flex; align-items: center; gap: 14px;
    padding: 15px 2px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .check-item:last-child { border-bottom: none; padding-bottom: 2px; }
  .check-box {
    width: 28px; height: 28px; border-radius: 9px;
    border: 2px solid var(--border);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; color: transparent;
    transition: all .12s ease;
  }
  .check-item:active .check-box { border-color: var(--accent); }
  .check-item.done .check-box { background: var(--good); border-color: var(--good); color: #06281c; }
  .ci-text { font-size: 16.5px; font-weight: 600; }
  .check-item.done .ci-text { color: var(--muted); }
  .check-item.done .ci-main { text-decoration: line-through; }
  .ci-detail { display: block; font-size: 13px; color: var(--muted); font-weight: 500; margin-top: 2px; text-decoration: none; }

  .empty { text-align: center; color: var(--muted); padding: 50px 20px; }
  .empty .big { font-size: 46px; margin-bottom: 12px; }

  .hist-item { cursor: pointer; }
  .hist-item:active { background: var(--surface-2); }
  .hist-top { display: flex; justify-content: space-between; align-items: center; }
  .hist-date { font-size: 17px; font-weight: 700; }
  .hist-day { font-size: 13px; color: var(--accent); font-weight: 700; margin-top: 3px; }
  .hist-meta { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .hist-note { font-size: 14px; color: var(--text); margin-top: 10px; font-style: italic; background: var(--surface-2); padding: 10px 12px; border-radius: 10px; }

  .detail-ex { margin-bottom: 16px; }
  .detail-ex .ex-name { font-size: 16px; margin-bottom: 6px; }
  .detail-sets { display: flex; flex-wrap: wrap; gap: 7px; }
  .set-pill {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 9px; padding: 7px 11px; font-size: 14px; font-weight: 600;
  }
  .set-pill .x { color: var(--muted); font-weight: 400; }

  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px);
    transform: translateX(-50%) translateY(20px);
    background: var(--good); color: #06281c;
    padding: 14px 22px; border-radius: 30px; font-weight: 700; font-size: 16px;
    opacity: 0; pointer-events: none; transition: all .3s ease; z-index: 100;
    box-shadow: 0 8px 30px rgba(0,0,0,.4);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .fade { animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="back-btn" id="backBtn" style="display:none" onclick="goHome()">‹ Back</button>
    <h1 id="title">Lift Log</h1>
    <button class="nav-tab" id="histTab" onclick="showHistory()">History</button>
  </header>
  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Program data ---------- */
const PROGRAM = [
  { key: "upperA", label: "Day 1", name: "Upper A", exercises: [
    { name: "Barbell Bench Press", sets: 4, reps: "5-6" },
    { name: "Barbell Row", sets: 4, reps: "6-8" },
    { name: "Overhead Press", sets: 3, reps: "6-8" },
    { name: "Lat Pulldown", sets: 3, reps: "8-10" },
    { name: "Incline Dumbbell Press", sets: 3, reps: "8-10" },
    { name: "Barbell/DB Curl", sets: 3, reps: "10-12" },
    { name: "Triceps Pushdown", sets: 3, reps: "10-12" },
  ]},
  { key: "lowerA", label: "Day 2", name: "Lower A", exercises: [
    { name: "Barbell Back Squat", sets: 4, reps: "5-6" },
    { name: "Romanian Deadlift", sets: 3, reps: "6-8" },
    { name: "Leg Press", sets: 3, reps: "10-12" },
    { name: "Leg Curl", sets: 3, reps: "10-12" },
    { name: "Standing Calf Raise", sets: 4, reps: "12-15" },
    { name: "Hanging Leg Raise", sets: 3, reps: "12-15" },
  ]},
  { key: "upperB", label: "Day 3", name: "Upper B", exercises: [
    { name: "Incline Barbell/DB Press", sets: 4, reps: "8-10" },
    { name: "Pull-Ups or Lat Pulldown", sets: 4, reps: "8-10" },
    { name: "Seated Cable Row", sets: 3, reps: "10-12" },
    { name: "Dumbbell Shoulder Press", sets: 3, reps: "10-12" },
    { name: "Lateral Raises", sets: 3, reps: "12-15" },
    { name: "Hammer Curls", sets: 3, reps: "10-12" },
    { name: "Overhead Triceps Extension", sets: 3, reps: "10-12" },
  ]},
  { key: "lowerB", label: "Day 4", name: "Lower B", exercises: [
    { name: "Deadlift", sets: 4, reps: "4-6" },
    { name: "Hack Squat or Leg Press", sets: 3, reps: "8-10" },
    { name: "Walking Lunges", sets: 3, reps: "10-12 / leg" },
    { name: "Leg Extension", sets: 3, reps: "12-15" },
    { name: "Seated Calf Raise", sets: 4, reps: "15" },
    { name: "Cable Crunch", sets: 3, reps: "12-15" },
  ]},
];

/* ---------- Warm-up / Cool-down (baked in) ---------- */
const WARMUP = {
  upper: [
    { t: "Arm circles", d: "10 forward / 10 back" },
    { t: "Band pull-aparts", d: "10" },
    { t: "Shoulder pass-throughs", d: "band / dowel / towel — 10" },
    { t: "Cat-Cow", d: "8 slow" },
    { t: "Wall slides", d: "10" },
    { t: "Light push-ups", d: "8-10" },
  ],
  lower: [
    { t: "Bodyweight squats", d: "15" },
    { t: "Leg swings", d: "10 per leg, each direction" },
    { t: "Hip circles / 90-90 rotations", d: "8 per side" },
    { t: "Glute bridges", d: "15" },
    { t: "Bird dogs", d: "8 per side" },
    { t: "Cat-Cow", d: "8 slow" },
  ],
};
const COOLDOWN = {
  upper: [
    { t: "Doorway / chest stretch", d: "30 sec" },
    { t: "Cross-body shoulder stretch", d: "30 sec per side" },
    { t: "Overhead triceps stretch", d: "30 sec per side" },
    { t: "Lat stretch", d: "30 sec per side" },
    { t: "Neck stretch", d: "20 sec per side" },
    { t: "Child's pose", d: "45 sec" },
  ],
  lower: [
    { t: "Standing quad stretch", d: "30 sec per side" },
    { t: "Hamstring stretch", d: "30 sec per side" },
    { t: "Hip-flexor / kneeling lunge stretch", d: "30 sec per side" },
    { t: "Figure-4 glute stretch", d: "30 sec per side" },
    { t: "Calf stretch", d: "30 sec per side" },
    { t: "Child's pose", d: "45 sec" },
  ],
};
function dayType(dayKey) { return dayKey.indexOf("upper") === 0 ? "upper" : "lower"; }

/* ---------- Storage ---------- */
const STORE_KEY = "liftlog.sessions.v1";
function loadSessions() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch (e) { return []; }
}
function saveSessions(arr) {
  localStorage.setItem(STORE_KEY, JSON.stringify(arr));
}
// Most recent session for a given day key (sessions stored newest-first)
function lastSessionFor(dayKey) {
  return loadSessions().find(s => s.dayKey === dayKey) || null;
}

/* ---------- Auto-progression ---------- */
// Top of a rep range string: "5-6"->6, "12-15"->15, "10-12 / leg"->12, "15"->15
function topOfRange(reps) {
  const nums = String(reps).match(/\d+/g);
  if (!nums) return Infinity; // can't parse -> never auto-progress
  return Math.max(...nums.map(Number));
}
// Default weight jump: bigger for the big lower-body compound lifts
function defaultIncrement(name) {
  const n = name.toLowerCase();
  const big = /squat|deadlift|leg press/.test(n);
  return big ? 10 : 5;
}
const INC_KEY = "liftlog.increments.v1";
function loadIncrements() {
  try { return JSON.parse(localStorage.getItem(INC_KEY)) || {}; }
  catch (e) { return {}; }
}
function getIncrement(name) {
  const o = loadIncrements();
  return (name in o) ? o[name] : defaultIncrement(name);
}
function setIncrementVal(name, val) {
  const o = loadIncrements();
  o[name] = val;
  localStorage.setItem(INC_KEY, JSON.stringify(o));
}
// Base weight from last session: uniform=true if every set used the same weight
function baseWeight(lastEx) {
  const ws = lastEx.sets.map(s => Number(s.weight));
  const uniform = ws.every(w => w === ws[0]);
  return { uniform: uniform, weight: ws[0], max: Math.max(...ws) };
}
// Did every set hit the top of the range last time? (needs reps >= top AND a logged weight)
function didProgress(ex, lastEx) {
  if (!lastEx || !lastEx.sets.length) return false;
  const top = topOfRange(ex.reps);
  return lastEx.sets.every(st =>
    st.weight !== "" && st.reps !== "" && Number(st.reps) >= top
  );
}

/* ---------- Helpers ---------- */
let currentDay = null; // day being viewed in an active session
let pendingSession = null; // workout data captured at Finish, saved after cool-down
const view = document.getElementById("view");
const titleEl = document.getElementById("title");
const backBtn = document.getElementById("backBtn");
const histTab = document.getElementById("histTab");

function esc(s){ return (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric', year:'numeric' });
}
function fmtDateShort(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
}
function daysAgo(iso) {
  const ms = Date.now() - new Date(iso).getTime();
  const d = Math.floor(ms / 86400000);
  if (d <= 0) return "today";
  if (d === 1) return "yesterday";
  if (d < 7) return d + " days ago";
  if (d < 14) return "1 week ago";
  return Math.floor(d/7) + " weeks ago";
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
}

function setHeader(title, showBack) {
  titleEl.textContent = title;
  backBtn.style.display = showBack ? "block" : "none";
}

/* ---------- Home ---------- */
function goHome() {
  setHeader("Lift Log", false);
  histTab.classList.remove("active");
  const sessions = loadSessions();
  let html = `<div class="fade">`;
  html += `<div class="section-title">Choose today's workout</div>`;
  PROGRAM.forEach(day => {
    const last = sessions.find(s => s.dayKey === day.key);
    const sub = last ? `Last done ${daysAgo(last.date)}` : "Not done yet";
    html += `
      <div class="card day-card" onclick="showWarmup('${day.key}')">
        <div>
          <div class="day-label">${day.label}</div>
          <div class="day-name">${esc(day.name)}</div>
          <div class="day-sub">${day.exercises.length} exercises · ${sub}</div>
        </div>
        <div class="chevron">›</div>
      </div>`;
  });
  html += `</div>`;
  view.innerHTML = html;
  window.scrollTo(0,0);
}

/* ---------- Warm-Up screen ---------- */
function checklistHtml(items) {
  return items.map(x => `
    <div class="check-item" onclick="this.classList.toggle('done')">
      <div class="check-box">✓</div>
      <div class="ci-text"><span class="ci-main">${esc(x.t)}</span><span class="ci-detail">${esc(x.d)}</span></div>
    </div>`).join("");
}

function showWarmup(dayKey) {
  const day = PROGRAM.find(d => d.key === dayKey);
  currentDay = day;
  setHeader(day.name + " · Warm-Up", true);
  backBtn.setAttribute("onclick", "goHome()");
  histTab.classList.remove("active");
  const drills = WARMUP[dayType(dayKey)];

  view.innerHTML = `<div class="fade">
    <p class="lead">Move to warm up — about 8-10 min.</p>
    <div class="card info-card">
      <div class="info-h">General · 3-5 min</div>
      <div class="info-b">Easy cardio: bike, incline walk, or rower — break a light sweat.</div>
    </div>
    <div class="card">
      <div class="section-title" style="margin-top:0">Dynamic drills</div>
      ${checklistHtml(drills)}
    </div>
    <div class="sticky-foot">
      <button class="btn" onclick="openSession('${dayKey}')">Start Workout ›</button>
    </div>
  </div>`;
  window.scrollTo(0, 0);
}

/* ---------- Session (active workout) ---------- */
function openSession(dayKey, prefill) {
  const day = PROGRAM.find(d => d.key === dayKey);
  currentDay = day;
  const last = lastSessionFor(dayKey);
  setHeader(day.name, true);
  backBtn.setAttribute("onclick", "goHome()");
  histTab.classList.remove("active");

  let html = `<div class="fade">`;
  if (last) {
    html += `<div class="section-title">Beat your last session — ${fmtDateShort(last.date)}</div>`;
  } else {
    html += `<div class="section-title">First time — set your baseline</div>`;
  }

  day.exercises.forEach((ex, ei) => {
    const lastEx = last ? last.exercises.find(e => e.name === ex.name) : null;
    let banner = "";
    if (lastEx) {
      if (didProgress(ex, lastEx)) {
        const inc = getIncrement(ex.name);
        const base = baseWeight(lastEx);
        const suggest = base.uniform
          ? `Try <span id="tgt-${ei}">${base.weight + inc}</span> lb today`
          : `Add weight today`;
        banner = `<div class="prog-banner progress">
          <span class="pb-icon">▲</span>
          <span>Progress! ${suggest}
            <button class="inc-btn" onclick="editIncrement(${ei})">+<span id="inc-${ei}">${inc}</span> lb ✎</button>
          </span></div>`;
      } else {
        banner = `<div class="prog-banner match">
          <span class="pb-icon">→</span>
          <span>Match or beat last time — see your numbers below.</span></div>`;
      }
    }
    html += `<div class="card exercise" data-ex="${ei}" data-name="${esc(ex.name)}">
      <div class="ex-head">
        <div class="ex-name">${esc(ex.name)}</div>
        <div class="ex-target">${ex.sets} × ${ex.reps}</div>
      </div>
      ${banner}
      <div class="col-head"><span>Set</span><span>Weight</span><span>Reps</span></div>`;
    for (let s = 0; s < ex.sets; s++) {
      const prev = lastEx && lastEx.sets[s];
      const pre = prefill && prefill.exercises[ei] && prefill.exercises[ei].sets[s];
      const preW = pre && pre.weight !== "" ? esc(String(pre.weight)) : "";
      const preR = pre && pre.reps !== "" ? esc(String(pre.reps)) : "";
      const lastTxt = (prev && (prev.weight !== "" || prev.reps !== ""))
        ? `Last: <b>${esc(String(prev.weight||"–"))} × ${esc(String(prev.reps||"–"))}</b>`
        : `Last: <b>—</b>`;
      html += `
        <div class="set-row">
          <div class="set-num">${s+1}</div>
          <div class="field">
            <input type="number" inputmode="decimal" step="any" value="${preW}" placeholder="${prev&&prev.weight!==""?esc(String(prev.weight)):'0'}" data-w="${ei}-${s}">
            <span class="unit">wt</span>
          </div>
          <div class="field">
            <input type="number" inputmode="numeric" value="${preR}" placeholder="${prev&&prev.reps!==""?esc(String(prev.reps)):'0'}" data-r="${ei}-${s}">
            <span class="unit">rep</span>
          </div>
        </div>
        <div class="last">${lastTxt}</div>`;
    }
    html += `</div>`;
  });

  html += `<div class="card">
      <div class="section-title" style="margin-top:0">Session note</div>
      <textarea id="note" placeholder="How did it feel? Energy, sleep, pumps, aches…">${prefill ? esc(prefill.note) : ""}</textarea>
    </div>`;

  html += `<div class="sticky-foot">
      <button class="btn" onclick="finishWorkout('${dayKey}')">Finish Workout</button>
    </div></div>`;

  view.innerHTML = html;
  window.scrollTo(0,0);
}

function finishWorkout(dayKey) {
  const day = PROGRAM.find(d => d.key === dayKey);
  const exercises = [];
  let anyEntry = false;

  day.exercises.forEach((ex, ei) => {
    const sets = [];
    for (let s = 0; s < ex.sets; s++) {
      const w = document.querySelector(`[data-w="${ei}-${s}"]`).value.trim();
      const r = document.querySelector(`[data-r="${ei}-${s}"]`).value.trim();
      if (w !== "" || r !== "") anyEntry = true;
      sets.push({ weight: w, reps: r });
    }
    exercises.push({ name: ex.name, sets });
  });

  if (!anyEntry) {
    if (!confirm("You haven't logged any sets. Save this empty workout anyway?")) return;
  }

  const note = document.getElementById("note").value.trim();
  // hold the workout; it's saved after the cool-down screen
  pendingSession = {
    dayKey: dayKey,
    dayName: day.name,
    dayLabel: day.label,
    note: note,
    exercises: exercises,
  };
  showCooldown(dayKey);
}

/* ---------- Cool-Down screen ---------- */
function showCooldown(dayKey) {
  const day = PROGRAM.find(d => d.key === dayKey);
  setHeader(day.name + " · Cool-Down", true);
  // back returns to the workout with everything you entered still filled in
  backBtn.setAttribute("onclick", "openSession('" + dayKey + "', pendingSession)");
  const drills = COOLDOWN[dayType(dayKey)];

  view.innerHTML = `<div class="fade">
    <p class="lead">Cool down — about 5 min. Easy breathing, gentle stretches.</p>
    <div class="card info-card">
      <div class="info-h">General · 2-3 min</div>
      <div class="info-b">Easy walk or slow cardio to bring your heart rate down.</div>
    </div>
    <div class="card">
      <div class="section-title" style="margin-top:0">Stretches — hold, don't bounce</div>
      ${checklistHtml(drills)}
    </div>
    <div class="sticky-foot">
      <button class="btn" onclick="commitSession()">Finish &amp; Save</button>
    </div>
  </div>`;
  window.scrollTo(0, 0);
}

function commitSession() {
  if (!pendingSession) return goHome();
  pendingSession.id = Date.now();
  pendingSession.date = new Date().toISOString();
  const all = loadSessions();
  all.unshift(pendingSession); // newest first
  saveSessions(all);
  pendingSession = null;
  toast("✓ Workout saved!");
  goHome();
}

// Override the suggested weight jump for an exercise (persists per exercise)
function editIncrement(ei) {
  if (!currentDay) return;
  const ex = currentDay.exercises[ei];
  const cur = getIncrement(ex.name);
  const v = prompt(`Weight jump for "${ex.name}" (lb):`, cur);
  if (v === null) return;
  const num = parseFloat(v);
  if (isNaN(num) || num < 0) { alert("Please enter a valid number."); return; }
  setIncrementVal(ex.name, num);
  const span = document.getElementById("inc-" + ei);
  if (span) span.textContent = num;
  // update the suggested target weight if it's shown
  const tgt = document.getElementById("tgt-" + ei);
  if (tgt) {
    const lastEx = (lastSessionFor(currentDay.key) || {exercises:[]})
      .exercises.find(e => e.name === ex.name);
    if (lastEx) tgt.textContent = baseWeight(lastEx).weight + num;
  }
  toast("Jump set to +" + num + " lb");
}

/* ---------- History ---------- */
function showHistory() {
  setHeader("History", true);
  histTab.classList.add("active");
  const sessions = loadSessions();

  if (!sessions.length) {
    view.innerHTML = `<div class="empty fade">
      <div class="big">🏋️</div>
      <div>No workouts logged yet.</div>
      <div style="margin-top:8px;font-size:14px">Finish a session and it'll show up here.</div>
    </div>`;
    return;
  }

  let html = `<div class="fade"><div class="section-title">${sessions.length} session${sessions.length>1?'s':''} logged</div>`;
  sessions.forEach(s => {
    const setsLogged = s.exercises.reduce((n, e) =>
      n + e.sets.filter(x => x.weight !== "" || x.reps !== "").length, 0);
    html += `<div class="card hist-item" onclick="showDetail(${s.id})">
      <div class="hist-top">
        <div>
          <div class="hist-date">${fmtDate(s.date)}</div>
          <div class="hist-day">${esc(s.dayLabel)} · ${esc(s.dayName)}</div>
        </div>
        <div class="chevron">›</div>
      </div>
      <div class="hist-meta">${setsLogged} set${setsLogged!==1?'s':''} logged · ${daysAgo(s.date)}</div>
      ${s.note ? `<div class="hist-note">“${esc(s.note)}”</div>` : ``}
    </div>`;
  });
  html += `</div>`;
  view.innerHTML = html;
  window.scrollTo(0,0);
}

function showDetail(id) {
  const s = loadSessions().find(x => x.id === id);
  if (!s) return showHistory();
  setHeader(s.dayName, true);
  backBtn.setAttribute("onclick", "showHistory()");

  let html = `<div class="fade">
    <div class="card">
      <div class="hist-date">${fmtDate(s.date)}</div>
      <div class="hist-day">${esc(s.dayLabel)} · ${esc(s.dayName)}</div>
      ${s.note ? `<div class="hist-note">“${esc(s.note)}”</div>` : ``}
    </div>
    <div class="card">`;

  s.exercises.forEach(ex => {
    const logged = ex.sets.filter(x => x.weight !== "" || x.reps !== "");
    html += `<div class="detail-ex">
      <div class="ex-name">${esc(ex.name)}</div>
      <div class="detail-sets">`;
    if (!logged.length) {
      html += `<span class="set-pill" style="color:var(--muted)">— skipped —</span>`;
    } else {
      ex.sets.forEach(x => {
        if (x.weight === "" && x.reps === "") return;
        html += `<span class="set-pill">${esc(String(x.weight||"–"))} <span class="x">×</span> ${esc(String(x.reps||"–"))}</span>`;
      });
    }
    html += `</div></div>`;
  });

  html += `</div>
    <button class="btn danger-text" onclick="deleteSession(${s.id})">Delete this session</button>
    </div>`;
  view.innerHTML = html;
  window.scrollTo(0,0);
}

function deleteSession(id) {
  if (!confirm("Delete this workout permanently?")) return;
  saveSessions(loadSessions().filter(x => x.id !== id));
  toast("Session deleted");
  showHistory();
}

/* reset back button behaviour when going home */
const _goHome = goHome;
goHome = function(){ backBtn.setAttribute("onclick","goHome()"); _goHome(); };

/* ---------- Init ---------- */
goHome();
</script>
</body>
</html>
